name: Deploy to EC2

# Redeploys the app on every push to main after CI passes, using GitHub OIDC
# (no AWS keys stored in GitHub) and SSM Run Command (no SSH).
#
# One-time setup, after `terraform apply` with github_repository set:
#   Settings > Secrets and variables > Actions > Variables:
#     AWS_DEPLOY_ROLE_ARN = terraform output github_deploy_role_arn
#     EC2_INSTANCE_ID     = terraform output instance_id
#     AWS_REGION          = ap-south-1

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: >-
      vars.AWS_DEPLOY_ROLE_ARN != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run update.sh on the instance through SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "GitHub Actions deploy ${GITHUB_SHA::7}" \
            --parameters 'commands=["bash /opt/ticketdesk/app/deploy/ec2/update.sh"]' \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query Status --output text)
          echo "Status: $STATUS"
          [ "$STATUS" = "Success" ]
