# nginx reverse proxy in front of the TicketDesk container (mounted as conf.d/default.conf).
server_tokens off;

log_format timed '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                 '"$http_user_agent" rt=$request_time';

server {
    listen 80 default_server;
    server_name _;
    access_log /dev/stdout timed;

    client_max_body_size 12m;   # app limit is 10 MB; leave room for form overhead

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
