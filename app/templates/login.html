{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block main_class %}login-page{% endblock %}
{% block content %}
<div class="card login-card">
  <h1>TicketDesk</h1>
  <p class="muted">IT support ticket tracking</p>
  {% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Username <input name="username" value="{{ username or '' }}" autocomplete="username" required autofocus></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn" type="submit">Log in</button>
  </form>
</div>
{% endblock %}
