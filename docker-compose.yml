# Local development stack. Values come from your git-ignored .env file.
#   docker compose up -d db                 # just PostgreSQL (run the app with uvicorn)
#   docker compose --profile app up -d --build   # PostgreSQL + the app in a container
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ticketdesk
      POSTGRES_USER: ticketdesk
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?set LOCAL_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketdesk -d ticketdesk"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      DATABASE_URL: postgresql+psycopg://ticketdesk:${LOCAL_DB_PASSWORD}@db:5432/ticketdesk
      STORAGE_BACKEND: local
      UPLOAD_DIR: /app/uploads
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads:/app/uploads
    profiles: ["app"]

volumes:
  pgdata:
  uploads:
