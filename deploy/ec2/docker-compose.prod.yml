# Production stack on the EC2 instance: TicketDesk app + nginx reverse proxy.
# Started by deploy/ec2/install.sh with:
#   docker compose --env-file /etc/ticketdesk/compose.env -f deploy/ec2/docker-compose.prod.yml up -d --build
# Container logs go to CloudWatch Logs (group ${APP_LOG_GROUP}) via the awslogs driver,
# using the instance role - no keys.

services:
  app:
    build:
      context: ../..
    image: ticketdesk-app:latest
    env_file: /etc/ticketdesk/ticketdesk.env
    environment:
      FORWARDED_ALLOW_IPS: "*"   # only nginx on the private compose network can reach the app
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?}
        awslogs-group: ${APP_LOG_GROUP:?}
        awslogs-create-group: "false"
        awslogs-stream: app

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?}
        awslogs-group: ${APP_LOG_GROUP:?}
        awslogs-create-group: "false"
        awslogs-stream: nginx
