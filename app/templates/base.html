<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TicketDesk{% endblock %} · TicketDesk</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  {% if user %}
  <header class="topbar">
    <a class="brand" href="/dashboard">TicketDesk</a>
    <nav>
      <a href="/dashboard">Dashboard</a>
      <a href="/tickets">Tickets</a>
      <a class="btn btn-small" href="/tickets/new">New ticket</a>
    </nav>
    <div class="who">
      <span>{{ user.display_name }} <span class="role">{{ user.role }}</span></span>
      <form method="post" action="/logout">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button class="link" type="submit">Log out</button>
      </form>
    </div>
  </header>
  {% endif %}
  <main class="{% block main_class %}page{% endblock %}">
    {% for kind, message in flashes %}
      <div class="flash flash-{{ kind }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
