{% extends "base.html" %}
{% block title %}New ticket{% endblock %}
{% block content %}
<h1>Raise a support request</h1>
{% for e in errors or [] %}<div class="flash flash-error">{{ e }}</div>{% endfor %}
<form class="card form" method="post" action="/tickets">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>Title <input name="title" maxlength="200" value="{{ form.title or '' }}" required></label>
  <div class="grid-2">
    <label>Category
      <select name="category">{% for c in categories %}<option {% if c == (form.category or 'Other') %}selected{% endif %}>{{ c }}</option>{% endfor %}</select>
    </label>
    <label>Priority
      <select name="priority">{% for p in priorities %}<option {% if p == (form.priority or 'Medium') %}selected{% endif %}>{{ p }}</option>{% endfor %}</select>
    </label>
  </div>
  <label>Description <textarea name="description" rows="7" required>{{ form.description or '' }}</textarea></label>
  <p class="muted">You can attach screenshots or documents after the ticket is created.</p>
  <button class="btn" type="submit">Create ticket</button>
</form>
{% endblock %}
